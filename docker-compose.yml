# TODO: Split into 3 launch file: Dev; Rover; GS 
services:
  ros2-dev:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        USERNAME: ${USERNAME:-devuser}
        INPUT_GID: ${INPUT_GID:-994}
        GPIO_GID: ${GPIO_GID:-999}
        ROS_BASE_IMAGE: ${ROS_BASE_IMAGE:-osrf/ros:humble-desktop}
    container_name: ros2_humble_demo
    volumes:
      - ./src:/ros2_ws/src:rw
      - ./build:/ros2_ws/build:rw
      - ./install:/ros2_ws/install:rw
      - ./log:/ros2_ws/log:rw
      - ./scripts/build.sh:/ros2_ws/build.sh:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/input:/dev/input
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/1000}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-47}
      - ROS_LOCALHOST_ONLY=0
      - ROS_NET_IFACE=${ROS_NET_IFACE:-}
    group_add:
      - "${INPUT_GID:-994}"
      - "${GPIO_GID:-999}"
    cap_add:
      - sys_nice
    ulimits:
      rtprio: 99
      memlock: -1
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    working_dir: /ros2_ws