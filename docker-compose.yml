# TODO: Split into 3 launch file: Dev; Rover; GS 
services:
  ros2-dev:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        USERNAME: ${USERNAME:-devuser}
        INPUT_GID: ${INPUT_GID:-994}
        DIALOUT_GID: ${DIALOUT_GID:-20}
        ROS_BASE_IMAGE: ${ROS_BASE_IMAGE:-osrf/ros:humble-desktop}
    container_name: ros2_humble_demo
    volumes:
      - ./src:/ros2_ws/src:rw
      - ./build:/ros2_ws/build:rw
      - ./install:/ros2_ws/install:rw
      - ./log:/ros2_ws/log:rw
      - ./scripts/build.sh:/ros2_ws/build.sh:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Whole /dev, not just /dev/input: privileged only snapshots the host's
      # device nodes at container creation, so a USB device plugged in later
      # (VN-300 on /dev/ttyUSB*) never shows up inside the container.
      - /dev:/dev
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/1000}
      # ROS 2 DDS networking for multi-machine discovery over the access point.
      # Both computers MUST share the same ROS_DOMAIN_ID; it also isolates us
      # from other teams that leave the default (0). ROS_LOCALHOST_ONLY=0 keeps
      # cross-machine discovery enabled.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-47}
      - ROS_LOCALHOST_ONLY=0
      # Interface (by name) that reaches the robot network, auto-detected by
      # setup.sh. The entrypoint pins Fast DDS to this NIC so discovery multicast
      # goes to the robot/AP link instead of the default-route (WiFi) interface.
      # Empty -> DDS uses all interfaces (fine for single-homed machines).
      - ROS_NET_IFACE=${ROS_NET_IFACE:-}
    # Add the host 'input' group so the container user can read /dev/input/event*
    # (ROS2 joy_node reads evdev, not js0). INPUT_GID is detected by setup.sh;
    # defaults to 994 (the usual Ubuntu 'input' GID).
    group_add:
      - "${INPUT_GID:-994}"
      - "${DIALOUT_GID:-20}"
    cap_add:
      - sys_nice
    ulimits:
      rtprio: 99
      memlock: -1
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    working_dir: /ros2_ws
