# Sparky CIRC 2026 -- ros2_control controller configuration
#
# Skid-steer 6-wheel rover. cmd_vel (geometry_msgs/Twist) is turned into a
# per-wheel velocity command by diff_drive_controller, which also publishes the
# odom -> base_link TF so the rover visibly drives around in RViz.
#
# Wheel layout (from sparky_description.urdf):
#   Left  side: Front_Left_Wheel_Joint, Center_Left_Wheel_Joint, Rear_Left_Wheel_Joint
#   Right side: Front_Right_Wheel_Joint, Center_Right_Wheel_Joint, Rear_Right_Wheel_Joint
#
# Drive it with the PS4 teleop (publishes /cmd_vel) or:
#   ros2 topic pub /cmd_vel geometry_msgs/msg/Twist '{linear: {x: 0.3}, angular: {z: 0.4}}'

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - Front_Left_Wheel_Joint
      - Center_Left_Wheel_Joint
      - Rear_Left_Wheel_Joint
    right_wheel_names:
      - Front_Right_Wheel_Joint
      - Center_Right_Wheel_Joint
      - Rear_Right_Wheel_Joint

    # Geometry (measured, Tasi design):
    #   wheel_radius:     0.099 m
    #   wheel_width:      0.115 m
    #   separation front/center: 0.969 m   (rear axle is narrower at 0.877 m)
    #   base footprint:   1.081 x 0.902 x 0.261 m
    # diff_drive_controller takes a single separation; using the front/center
    # value. If odometry drifts on turns, tune wheel_separation_multiplier.
    wheel_separation: 0.969   # [m] front/center axle, L-R
    wheel_radius: 0.099       # [m] Tasi design

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Closed loop: integrate the wheel state fed back by the (mock) hardware.
    open_loop: false
    # odom->base_link TF is owned by robot_localization's ekf_local
    # (sparky_localization), which fuses this wheel odom with the VN-300 IMU.
    # Two nodes publishing the same transform is the #1 robot_localization bug,
    # so diff_drive only publishes the /diff_drive_controller/odom TOPIC here.
    # NOTE: if you run the drivetrain WITHOUT sparky_localization, RViz will have
    # no odom->base_link -- either launch localization (use_gps:=false is fine)
    # or temporarily set this back to true.
    enable_odom_tf: false

    cmd_vel_timeout: 0.5
    # Subscribe to a plain Twist (geometry_msgs/Twist) instead of TwistStamped,
    # which is what the PS4 teleop node publishes.
    use_stamped_vel: false

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 10.0
    linear.x.min_velocity: -10.0
    linear.x.max_acceleration: 5.0
    linear.x.min_acceleration: -5.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 5.0
    angular.z.min_velocity: -5.0
    angular.z.max_acceleration: 5.0
    angular.z.min_acceleration: -5.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0
