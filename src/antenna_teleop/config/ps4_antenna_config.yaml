antenna_joy_node:
  ros__parameters:
    # Indices into sensor_msgs/Joy.buttons. Per
    # groundstation_bringup/config/ps4_mapping.md, 3 is Triangle and 1 is Circle.
    # The D-pad left/right are 13 and 14 if you want those instead.
    left_button: 3
    right_button: 1

    # Sent verbatim to the antenna Arduino, one per button press.
    left_command: "pd6,25"
    right_command: "pd8,75"
